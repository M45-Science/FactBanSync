name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Build
      run: go build -mod=readonly -v ./...

    - name: Test
      run: go test -mod=readonly -race -v ./...

    - name: Vet
      run: go vet -mod=readonly ./...
